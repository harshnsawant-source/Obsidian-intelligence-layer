[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-intelligence-layer"
version = "0.1.0"
description = "Local-first multi-agent intelligence layer with semantic memory and agent-to-agent communication."
requires-python = ">=3.14"
dependencies = [
    "requests>=2.31",
    "numpy>=2.0",
]

# src layout: code packages live under src/ (core, agents, capability, configs).
# The app also runs directly from src/ without installation.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["core*", "agents*", "capability*", "configs*"]
